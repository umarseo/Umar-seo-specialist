<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0B0F17" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="chartAreaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.0"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Main Dark Glass Dashboard Container -->
  <rect x="20" y="20" width="560" height="440" rx="20" fill="url(#cardBg)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1.5" filter="url(#shadow)"/>

  <!-- Top Glass Header Bar -->
  <rect x="20" y="20" width="560" height="54" rx="20" fill="rgba(255, 255, 255, 0.03)"/>
  <circle cx="50" cy="47" r="6" fill="#EF4444"/>
  <circle cx="70" cy="47" r="6" fill="#F59E0B"/>
  <circle cx="90" cy="47" r="6" fill="#10B981"/>
  <text x="120" y="52" fill="#94A3B8" font-family="sans-serif" font-size="13" font-weight="500">Google Search Console — Performance Insights</text>
  <rect x="440" y="37" width="120" height="20" rx="10" fill="rgba(16, 185, 129, 0.15)" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1"/>
  <text x="452" y="51" fill="#10B981" font-family="sans-serif" font-size="11" font-weight="600">● LIVE MONITOR</text>

  <!-- Metrics Grid -->
  <!-- Stat Card 1: Organic Clicks -->
  <rect x="45" y="95" width="155" height="80" rx="12" fill="rgba(15, 23, 42, 0.8)" stroke="rgba(255, 255, 255, 0.08)"/>
  <text x="60" y="120" fill="#64748B" font-family="sans-serif" font-size="11" font-weight="600">TOTAL ORGANIC CLICKS</text>
  <text x="60" y="148" fill="#F8FAFC" font-family="sans-serif" font-size="22" font-weight="700">148.5K</text>
  <rect x="135" y="130" width="55" height="20" rx="4" fill="rgba(16, 185, 129, 0.2)"/>
  <text x="142" y="144" fill="#10B981" font-family="sans-serif" font-size="11" font-weight="700">+28.4%</text>

  <!-- Stat Card 2: Total Impressions -->
  <rect x="222" y="95" width="155" height="80" rx="12" fill="rgba(15, 23, 42, 0.8)" stroke="rgba(255, 255, 255, 0.08)"/>
  <text x="237" y="120" fill="#64748B" font-family="sans-serif" font-size="11" font-weight="600">TOTAL IMPRESSIONS</text>
  <text x="237" y="148" fill="#F8FAFC" font-family="sans-serif" font-size="22" font-weight="700">2.1M</text>
  <rect x="307" y="130" width="58" height="20" rx="4" fill="rgba(6, 186, 212, 0.2)"/>
  <text x="314" y="144" fill="#06B6D4" font-family="sans-serif" font-size="11" font-weight="700">+42.1%</text>

  <!-- Stat Card 3: Avg CTR -->
  <rect x="400" y="95" width="155" height="80" rx="12" fill="rgba(15, 23, 42, 0.8)" stroke="rgba(255, 255, 255, 0.08)"/>
  <text x="415" y="120" fill="#64748B" font-family="sans-serif" font-size="11" font-weight="600">AVG. POSITION</text>
  <text x="415" y="148" fill="#F8FAFC" font-family="sans-serif" font-size="22" font-weight="700"># 3.2</text>
  <rect x="480" y="130" width="65" height="20" rx="4" fill="rgba(16, 185, 129, 0.2)"/>
  <text x="486" y="144" fill="#10B981" font-family="sans-serif" font-size="11" font-weight="700">Top 3 Rank</text>

  <!-- Main Chart Container -->
  <rect x="45" y="195" width="510" height="210" rx="14" fill="rgba(11, 15, 23, 0.9)" stroke="rgba(255, 255, 255, 0.05)"/>
  
  <!-- Chart Grid Lines -->
  <line x1="65" y1="230" x2="535" y2="230" stroke="rgba(255, 255, 255, 0.05)" stroke-dasharray="4 4"/>
  <line x1="65" y1="270" x2="535" y2="270" stroke="rgba(255, 255, 255, 0.05)" stroke-dasharray="4 4"/>
  <line x1="65" y1="310" x2="535" y2="310" stroke="rgba(255, 255, 255, 0.05)" stroke-dasharray="4 4"/>
  <line x1="65" y1="350" x2="535" y2="350" stroke="rgba(255, 255, 255, 0.05)" stroke-dasharray="4 4"/>

  <!-- Organic Traffic Fill Area -->
  <path d="M 65 350 L 65 320 Q 120 300, 175 280 T 285 240 T 395 215 T 535 205 L 535 370 L 65 370 Z" fill="url(#chartAreaGrad)"/>
  
  <!-- Organic Growth Line Curve -->
  <path d="M 65 320 Q 120 300, 175 280 T 285 240 T 395 215 T 535 205" fill="none" stroke="url(#emeraldGrad)" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Chart Points -->
  <circle cx="175" cy="280" r="5" fill="#10B981" stroke="#0F172A" stroke-width="2"/>
  <circle cx="285" cy="240" r="5" fill="#10B981" stroke="#0F172A" stroke-width="2"/>
  <circle cx="395" cy="215" r="5" fill="#06B6D4" stroke="#0F172A" stroke-width="2"/>
  <circle cx="535" cy="205" r="6" fill="#10B981" stroke="#0F172A" stroke-width="2"/>

  <!-- High Performing Keyword Floating Badge 1 -->
  <g transform="translate(320, 200)">
    <rect width="130" height="34" rx="8" fill="#0F172A" stroke="rgba(16, 185, 129, 0.4)" stroke-width="1"/>
    <text x="12" y="16" fill="#94A3B8" font-family="sans-serif" font-size="10" font-weight="500">Target Keyword</text>
    <text x="12" y="28" fill="#10B981" font-family="sans-serif" font-size="11" font-weight="700">"Healthcare SEO" #1</text>
  </g>

  <!-- Health Score Floating Badge -->
  <g transform="translate(60, 390)">
    <rect width="210" height="42" rx="10" fill="rgba(15, 23, 42, 0.95)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>
    <circle cx="25" cy="21" r="14" fill="rgba(16, 185, 129, 0.2)"/>
    <text x="18" y="25" fill="#10B981" font-family="sans-serif" font-size="12" font-weight="700">✓</text>
    <text x="48" y="18" fill="#F8FAFC" font-family="sans-serif" font-size="12" font-weight="700">Technical Health: 98/100</text>
    <text x="48" y="32" fill="#94A3B8" font-family="sans-serif" font-size="10">Passed Core Web Vitals</text>
  </g>

  <!-- Local Map Pack Floating Badge -->
  <g transform="translate(335, 390)">
    <rect width="220" height="42" rx="10" fill="rgba(15, 23, 42, 0.95)" stroke="rgba(6, 186, 212, 0.3)" stroke-width="1"/>
    <text x="15" y="18" fill="#06B6D4" font-family="sans-serif" font-size="11" font-weight="700">📍 Google Business Profile</text>
    <text x="15" y="32" fill="#94A3B8" font-family="sans-serif" font-size="10">Top 3 Local Pack Ranking Verified</text>
  </g>
</svg>
